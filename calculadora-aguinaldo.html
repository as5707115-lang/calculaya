<main>

<section class="card">

<h2>Calculadora de aguinaldo</h2>

<p>Ingresá tu mejor sueldo mensual para estimar el aguinaldo.</p>

<input type="number" id="sueldo" placeholder="Mejor sueldo mensual">

<button onclick="calcularAguinaldo()">Calcular</button>

<p id="resultado"></p>

</section>

</main>

<footer>
<p>© 2026 CalculaYa - Creado por Alexis Martinez</p>
</footer>

<script>
function calcularAguinaldo() {
  let sueldo = Number(document.getElementById("sueldo").value);

  if (sueldo <= 0) {
    document.getElementById("resultado").innerText =
      "Ingresá un sueldo válido.";
    return;
  }

  let aguinaldo = sueldo / 2;

  document.getElementById("resultado").innerText =
    "Aguinaldo estimado: $" + aguinaldo.toFixed(2);
}
</script>

</body>
